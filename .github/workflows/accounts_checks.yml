name: Account security checks

on:
  push:
    paths:
      - 'services/accounts/**'
      - 'Notchscape/models/AccountSettingsPolicy.swift'
      - 'tests/AccountSettingsPolicyTests.swift'
      - '.github/workflows/accounts_checks.yml'
  pull_request:
    paths:
      - 'services/accounts/**'
      - 'Notchscape/models/AccountSettingsPolicy.swift'
      - 'tests/AccountSettingsPolicyTests.swift'
      - '.github/workflows/accounts_checks.yml'

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/accounts/package-lock.json
      - run: npm ci
        working-directory: services/accounts
      - run: npm test
        working-directory: services/accounts
      - run: npm run check
        working-directory: services/accounts
